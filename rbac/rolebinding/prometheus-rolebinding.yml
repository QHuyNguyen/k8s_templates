apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-rolebinding
  namespace: kube-system
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: prometheus-admin-role
  apiGroup: rbac.authorization.k8s.io